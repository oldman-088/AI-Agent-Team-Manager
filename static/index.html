<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Team Manager</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><p class="eyebrow">LOCAL WORKSPACE</p><h1>Agent Team Manager</h1><p>Organize your team and track work in one place.</p></header><p id="message" role="alert"></p><div class="layout"><section><h2>Agents</h2><form id="agent-form"><label>Name<input name="name" maxlength="100" required></label><label>Role<input name="role" maxlength="200" required></label><button>Add agent</button></form><div id="agents"></div></section><section><h2>Tasks</h2><form id="task-form"><label>Title<input name="title" maxlength="200" required></label><label>Description<textarea name="description" maxlength="4000"></textarea></label><label>Assign to<select name="agent_id" id="assignment"><option value="">Unassigned</option></select></label><button>Add task</button></form><div id="tasks"></div></section></div></main></body></html>
