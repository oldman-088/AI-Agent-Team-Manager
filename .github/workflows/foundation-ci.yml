name: Backend foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aatm_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: aatm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AATM_TEST_DATABASE_URL: postgresql+psycopg://aatm_test:test-only-password@localhost:5432/aatm_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -v
