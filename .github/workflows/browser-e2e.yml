name: Browser end-to-end
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e 'backend[test]'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run test:e2e > e2e.log 2>&1
          status=$?
          cat e2e.log
          if [ "$status" -ne 0 ]; then
            python -c "from pathlib import Path; t=(Path('e2e.log').read_text(errors='replace') + '\n' + '\n'.join(p.read_text(errors='replace').split('- region \"Planning tasks\"')[-1][:5500] for p in Path('test-results').rglob('error-context.md')))[-14000:]; print('::error title=Browser test output::'+t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
          fi
          exit "$status"
